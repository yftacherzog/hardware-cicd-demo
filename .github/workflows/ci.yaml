name: Hardware Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    name: Run Hardware Verification Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++ zlib1g-dev

      - name: Install Python Package and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Hardware Tests via Pytest
        env:
          SIM: verilator
        run: |
          pytest -v

      - name: Archive Waveforms and Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulation-artifacts
          path: |
            sim_build*/
            *.vcd
            *.fst
            results.xml
          retention-days: 7
