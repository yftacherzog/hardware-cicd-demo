name: Hardware Verification CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  simulate:
    name: Run ALU Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install System Dependencies (Verilator)
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++

      - name: Install Python Framework (Cocotb)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Hardware Simulation
        run: |
          # This executes the Makefile, exactly as you did locally
          make

      - name: Check Test Results
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('results.xml')
          root = tree.getroot()

          # Search for any failure or error tags anywhere in the XML tree
          failures = root.findall('.//failure')
          errors = root.findall('.//error')

          total_issues = len(failures) + len(errors)
          print(f'Total test failures/errors found: {total_issues}')

          if total_issues > 0:
              exit(1)
          else:
              exit(0)
          "

      - name: Archive Waveforms and Test Results
        uses: actions/upload-artifact@v4
        if: always() # Ensure artifacts are saved even if the test fails
        with:
          name: alu-simulation-artifacts
          path: |
            dump.vcd
            results.xml
          retention-days: 7
